<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Test cadre</title>
<meta name="theme-color" content="#073b2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Test cadre">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="diag2.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Mêmes règles que la page de lancement de Suivi Chantier. */
html,body{margin:0;height:100%;background:#073b2a;overflow:hidden}
#app{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);border:0;width:100%;height:calc(100% - env(safe-area-inset-top,0px));height:calc(100dvh - env(safe-area-inset-top,0px));display:block;background:#073b2a}
#probe{position:fixed;left:0;top:0;width:1px;height:100dvh;visibility:hidden;pointer-events:none}
#bar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(0,0,0,.86);color:#fff;font:11.5px/1.35 Menlo,Consolas,monospace;padding:6px 8px;box-sizing:border-box}
#bar button{font:700 14px Arial,sans-serif;padding:9px 12px;border:0;border-radius:8px;background:#34c759;color:#000;margin-right:8px}
#bar button#hide{background:#ddd}
#res{white-space:pre-wrap;margin-top:6px;max-height:46vh;overflow:auto}
</style>
</head>
<body>
<iframe id="app" title="Suivi Chantier" src="https://script.google.com/macros/s/AKfycbxSG8rKK2wT4kazHNf4a1O_d72vowQAjfW--ehpkdWRVjxqiUogOkJYdiW890TzIH7I/exec" allow="geolocation; web-share; clipboard-write; camera; fullscreen"></iframe>
<div id="probe"></div>
<div id="bar"><button id="go">Lancer les essais</button><button id="hide">Masquer</button><span id="st">attente de l'appli…</span><div id="res"></div></div>
<script>
(function(){
  var f=document.getElementById('app'),p=document.getElementById('probe'),res=document.getElementById('res'),st=document.getElementById('st');
  var q=new URLSearchParams(location.search),local=location.hostname==='127.0.0.1';
  if(local&&q.get('src'))f.src=q.get('src');            // essais sur ordinateur seulement
  var OK=function(o){return /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(o)||local;};
  var last=null,lastAt=0;
  // Même calcul que la page de lancement (fit)
  function fit(){
    if(!f||!p||(navigator.standalone!==true&&!(local&&q.get('force'))))return;
    f.style.height='';
    var top=f.getBoundingClientRect().top,land=window.matchMedia('(orientation: landscape)').matches;
    var screenH=land?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height);
    var h=top>0?screenH-top:Math.min(p.getBoundingClientRect().height,screenH-top);
    if(h>200)f.style.height=Math.round(h)+'px';
  }
  var refit=function(){fit();setTimeout(fit,300);setTimeout(fit,1500);setTimeout(fit,5000);};
  refit();window.addEventListener('resize',refit);window.addEventListener('pageshow',refit);
  function upd(){st.textContent=last?('appli jointe : cadre '+Math.round(f.getBoundingClientRect().height)+' / app '+last.h):'attente de l\'appli (connecte-toi, puis touche « Lancer »)';}
  window.addEventListener('message',function(e){
    if(!OK(e.origin))return;var d=e.data||{};if(!d.sc)return;
    if(d.type==='sc-diag-hello'){try{e.source.postMessage({sc:1,type:'sc-diag-yes'},e.origin);}catch(x){}}
    else if(d.type==='sc-metrics'){last=d.m;lastAt=Date.now();upd();}
  });
  upd();
  var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms);});};
  function base(){f.style.cssText='';fit();}
  var EX=[
    ['E0 normal (comme la page de lancement)',async function(){}],
    ['E1 cadre +1 px puis retour',async function(){var h=f.getBoundingClientRect().height;f.style.height=(h+1)+'px';await sleep(500);f.style.height=Math.round(h)+'px';}],
    ['E2 cadre rechargé',async function(){last=null;f.src=f.src;await sleep(9000);}],
    ['E3 hauteur 932 px (écran)',async function(){f.style.height='932px';}],
    ['E4 position absolue, hauteur 100 % du parent',async function(){f.style.position='absolute';f.style.top='0';f.style.bottom='';f.style.height='100%';}],
    ['E5 caché puis réaffiché',async function(){f.style.display='none';await sleep(300);f.style.display='block';}],
    ['E6 hauteur 100lvh',async function(){f.style.height='100lvh';}]
  ];
  var running=false;
  async function run(){
    if(running)return;running=true;var out=[];var vv=window.visualViewport;
    out.push('dehors : fenêtre '+window.innerWidth+'×'+window.innerHeight+'  écran '+screen.width+'×'+screen.height+'  appli(standalone)='+navigator.standalone);
    out.push('cadre = hauteur du cadre vu de dehors ; app = hauteur que l\'appli annonce dedans ; écart = bande');
    res.textContent=out.join('\n');var e0=null;
    for(var i=0;i<EX.length;i++){
      base();await sleep(1200);last=(EX[i][0].indexOf('E2')===0)?null:last;await EX[i][1]();await sleep(2500);
      var r=f.getBoundingClientRect(),m=last,line;
      if(m){var gap=Math.round(r.height)-m.h;line=EX[i][0]+' : cadre '+Math.round(r.height)+' | app '+m.h+' | écart '+gap+(gap>3?'   <-- BANDE':'  ok');if(i===0)e0=m;}
      else line=EX[i][0]+' : cadre '+Math.round(r.height)+' | app ? (pas de réponse)';
      out.push(line);res.textContent=out.join('\n');
    }
    if(e0){out.push('');out.push('détail E0 : fenêtre '+e0.w+'×'+e0.h+'  clientHeight '+e0.ch+'  body '+e0.bh+'  scroll '+e0.sh+'  visualViewport '+e0.vv);
      out.push('fond html '+e0.htmlBg+'  fond body '+e0.bodyBg);out.push('tout en bas : '+e0.bot+'  fond '+e0.botBg);}
    out.push('fin '+new Date().toLocaleTimeString('fr-FR'));res.textContent=out.join('\n');base();running=false;
  }
  document.getElementById('go').addEventListener('click',run);
  document.getElementById('hide').addEventListener('click',function(){res.style.display=res.style.display==='none'?'':'none';});
  if(local&&q.get('auto'))setTimeout(run,3000);
})();
</script>
</body>
</html>
