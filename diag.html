<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Test affichage</title>
<meta name="theme-color" content="#073b2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Test affichage">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="diag.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Mêmes règles que la page de lancement de Suivi Chantier, pour mesurer la même chose. */
html,body{margin:0;height:100%;background:#073b2a;overflow:hidden;font-family:Arial,sans-serif}
#sim{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);border:0;width:100%;height:calc(100% - env(safe-area-inset-top,0px));height:calc(100dvh - env(safe-area-inset-top,0px));display:block;background:#0f6b45;box-shadow:inset 0 0 0 3px #ffe14d;color:#fff;box-sizing:border-box;padding:26px 8px 26px}
#probe{position:fixed;left:0;top:0;width:1px;height:100dvh;visibility:hidden;pointer-events:none}
#p100vh,#p100dvh,#p100svh,#p100lvh{position:fixed;left:2px;top:0;width:1px;visibility:hidden;pointer-events:none}
#p100vh{height:100vh}#p100dvh{height:100dvh}#p100svh{height:100svh}#p100lvh{height:100lvh}
#ins{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
h1{margin:0 0 4px;font-size:15px}
pre{margin:0;font:12.5px/1.32 Menlo,Consolas,monospace;white-space:pre-wrap;color:#fff}
.mk{position:fixed;height:20px;width:20%;font:700 10px/20px Arial,sans-serif;color:#000;text-align:center;overflow:hidden;white-space:nowrap}
</style>
</head>
<body>
<div id="probe"></div><div id="p100vh"></div><div id="p100dvh"></div><div id="p100svh"></div><div id="p100lvh"></div><div id="ins"></div>
<div id="sim"><h1>Test d'affichage — envoie-moi une capture d'écran</h1><pre id="out">mesure en cours…</pre></div>
<!-- repères : chaque barre colle au « bas » d'une mesure différente ; on regarde lesquelles touchent le vrai bas de l'écran -->
<div class="mk" id="m1" style="left:0;background:#ff3b30">ROUGE bottom:0</div>
<div class="mk" id="m2" style="left:20%;background:#3b82f6">BLEU screen.height</div>
<div class="mk" id="m3" style="left:40%;background:#34c759">VERT 100lvh</div>
<div class="mk" id="m4" style="left:60%;background:#ff9500">ORANGE 100dvh</div>
<div class="mk" id="m5" style="left:80%;background:#fff">BLANC 100svh</div>
<div class="mk" id="t1" style="left:0;top:0;width:50%;background:#ff2dd0">MAGENTA top:0</div>
<div class="mk" id="t2" style="left:50%;top:env(safe-area-inset-top,0px);width:50%;background:#22d3ee">CYAN sous la barre d'état</div>
<script>
(function(){
  var out=document.getElementById('out'),sim=document.getElementById('sim');
  function hh(id){return Math.round(document.getElementById(id).getBoundingClientRect().height*10)/10;}
  function ins(){var cs=getComputedStyle(document.getElementById('ins'));return {t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}
  var fitDone='non',fitVal='';
  // Même calcul que la page de lancement (fit)
  function fit(){
    var f=sim,p=document.getElementById('probe');if(navigator.standalone!==true){fitDone='non (pas en mode application)';return;}
    f.style.height='';
    var top=f.getBoundingClientRect().top,land=window.matchMedia('(orientation: landscape)').matches;
    var screenH=land?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height);
    var h=top>0?screenH-top:Math.min(p.getBoundingClientRect().height,screenH-top);
    if(h>200){f.style.height=Math.round(h)+'px';fitDone='oui';fitVal=Math.round(h)+' px (haut='+Math.round(top)+')';}
  }
  function place(){
    var sh=Math.max(screen.width,screen.height);
    if(window.matchMedia('(orientation: landscape)').matches)sh=Math.min(screen.width,screen.height);
    function at(id,bottom){var e=document.getElementById(id);e.style.top=Math.round(bottom-20)+'px';}
    at('m1',window.innerHeight);   // ROUGE : le bas annoncé de la fenêtre (comme bottom:0)
    var r=document.getElementById('m1');r.style.top='';r.style.bottom='0';
    at('m2',sh);at('m3',hh('p100lvh'));at('m4',hh('p100dvh'));at('m5',hh('p100svh'));
  }
  function measure(){
    fit();place();
    var vv=window.visualViewport,I=ins(),r=sim.getBoundingClientRect();
    var L=[];
    L.push('mode application (navigator.standalone) : '+navigator.standalone);
    L.push('mode « standalone » (CSS) : '+window.matchMedia('(display-mode: standalone)').matches);
    L.push('fenêtre  largeur × hauteur : '+window.innerWidth+' × '+window.innerHeight);
    L.push('outerHeight : '+window.outerHeight+'   clientHeight : '+document.documentElement.clientHeight);
    L.push('écran    largeur × hauteur : '+screen.width+' × '+screen.height+'  (utile : '+screen.availHeight+')');
    L.push('visualViewport hauteur : '+(vv?Math.round(vv.height*10)/10:'?')+'   décalage haut : '+(vv?vv.offsetTop:'?')+'   zoom : '+(vv?vv.scale:'?'));
    L.push('100vh='+hh('p100vh')+'  100dvh='+hh('p100dvh')+'  100svh='+hh('p100svh')+'  100lvh='+hh('p100lvh'));
    L.push('zones sûres  haut='+I.t+'  bas='+I.b+'  gauche='+I.l+'  droite='+I.r);
    L.push('cadre jaune : haut='+Math.round(r.top)+'  bas='+Math.round(r.bottom)+'  hauteur='+Math.round(r.height));
    L.push('calcul « fit » appliqué : '+fitDone+(fitVal?'  → '+fitVal:''));
    L.push('sens : '+(window.matchMedia('(orientation: landscape)').matches?'paysage':'portrait'));
    L.push('');
    L.push('Comment lire : la bande foncée hors du cadre jaune, en bas,');
    L.push('est la bande qui gêne. Regarde quelles barres de couleur');
    L.push('touchent le tout dernier bord bas de l\'écran.');
    L.push(new Date().toLocaleTimeString('fr-FR'));
    out.textContent=L.join('\n');
  }
  measure();setInterval(measure,800);
  window.addEventListener('resize',measure);window.addEventListener('orientationchange',function(){setTimeout(measure,300);});window.addEventListener('pageshow',measure);
})();
</script>
</body>
</html>
